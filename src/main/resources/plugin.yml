name: PhilosNPC
version: '${version}'
main: com.phcraft.philosnpc.PhilosNPCPlugin
api-version: '26.3'
author: PhCraft Team
description: 功能NPC插件 - 创建可交互的玩家/系统NPC，支持商店/传送/点歌/留言
depend:
  - Vault

commands:
  philosnpc:
    description: PhilosNPC 主命令
    usage: /philosnpc <create|syscreate|list|edit|move|delete|tp|reload>
    aliases:
      - pnpc

permissions:
  philosnpc.create:
    description: 创建个人NPC
    default: true
  philosnpc.admin:
    description: 管理员权限（创建系统NPC等）
    default: op
